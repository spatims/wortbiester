<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#141a26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Wortbiester</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-live="polite">
    <p id="laden" style="margin:auto;font-family:Nunito,system-ui,sans-serif;font-size:1.25rem;opacity:.7">Wortbiester lädt …</p>
  </main>
  <script type="module" src="js/app.js"></script>
  <script>
    // Bleibt der Ladehinweis stehen, konnte die App nicht starten (fehlende Datei, alter Browser).
    setTimeout(() => {
      const p = document.getElementById('laden');
      if (p) p.textContent = 'Wortbiester konnte nicht starten. Lade die Seite neu oder sag einem Erwachsenen Bescheid.';
    }, 4000);
  </script>
</body>
</html>
